name: BlazeDemo Automation

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run Tests
        run: mvn clean test

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports
          path: |
            reports/**
            target/surefire-reports/**

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Reports
        uses: actions/download-artifact@v4
        with:
          name: Test-Reports
          path: ./reports

      - name: Show Folder Structure
        run: |
          echo "=== Current Directory ==="
          pwd
          echo "=== All Files ==="
          ls -R
          echo "=== Check if automation report exists ==="
          find . -name "AutomationReport.html" || echo "AutomationReport.html NOT found"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ./reports
          clean: false
