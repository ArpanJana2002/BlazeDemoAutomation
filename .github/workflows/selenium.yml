name: BlazeDemo Automation

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run Tests
        run: mvn clean test

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports
          path: |
            reports/**
            target/surefire-reports/**

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    
    steps:
      - name: Download Reports
        uses: actions/download-artifact@v4
        with:
          name: Test-Reports

      - name: Show Folder Structure
        run: |
          echo "=== Current Directory ==="
          pwd
          echo "=== All Files ==="
          ls -R
          echo "=== Check if reports exists ==="
          ls -la reports/ 2>/dev/null || echo "reports folder NOT found"
          echo "=== Check Test-Reports ==="
          ls -la Test-Reports/ 2>/dev/null || echo "Test-Reports folder NOT found"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
          target-folder: reports
          clean: false
